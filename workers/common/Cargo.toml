[package]
name = "premium-discount-worker-common"
description = "premium-discount Workers 공용: JS 값 모형(V, 참조 공유 · undefined/null · JS 키 순서 · JSON.stringify/parse), D1 · Vectorize · fetch 를 JS 그대로 부르는 얇은 층, gzip(pako), aws4fetch(S3 SigV4) · ethers 주소. logis-center workers/common(370d67a3)에서 옮겨 왔다"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
indexmap.workspace = true
ryu-js.workspace = true
flate2.workspace = true
regex.workspace = true
fancy-regex.workspace = true
premium-discount-identity.workspace = true
hmac.workspace = true
sha2.workspace = true
k256.workspace = true
tiny-keccak.workspace = true
getrandom.workspace = true
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# getrandom_backend="wasm_js" (.cargo/config.toml) 와 짝
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true
