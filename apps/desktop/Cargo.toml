[package]
name = "premium-discount-desktop"
version = "0.1.0"
description = "premium.discount 데스크톱 앱 (Tauri 창)"
edition = "2021"

# 앱 코어(premium-discount-app, apps/core)와 화면(web/desktop/dist)을 묶는 창이다. 코어는 GUI 의존성이 없도록 따로 둔다.
# Android·iOS 빌드는 앱을 라이브러리로 만든다 (tauri mobile_entry_point). 데스크톱은 main.rs가 이 라이브러리의 run()을 부른다.
# 이름은 바이너리와 겹치지 않게 따로 둔다.
[lib]
name = "premium_discount_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 앱 코어의 GPU 백엔드를 그대로 넘긴다 (apps/core/Cargo.toml)
cuda = ["premium-discount-app/cuda"]
rocm = ["premium-discount-app/rocm"]
vulkan = ["premium-discount-app/vulkan"]
metal = ["premium-discount-app/metal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
premium-discount-app.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: tauri.conf.json의 app.macOSPrivateApi(macOS 투명 창)와 짝이어야 한다. 다르면 tauri-build가 빌드를 멈춘다 (새 의존성은 없다)
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }

# 프로필(debug = 0, gemm-common · gemm-f16 opt-level 3)과 candle 포크 [patch.crates-io] 는 루트 작업 공간(../../Cargo.toml)에 있다.
# 예전에는 이 매니페스트 · app/Cargo.toml · crates/Cargo.toml 이 같은 줄을 따로 들고 있었다.
