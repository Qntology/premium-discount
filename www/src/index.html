	<script>
		// 기존 스크립트 유지
		var cookies = ${JSON.stringify(cookies)}
		var rows = ${JSON.stringify(rows)}

		// 링크 제출 함수 추가
		async function submitAiLink() {
			var linkInput = document.getElementById('aiShareLink').value.trim();
			var msgEl = document.getElementById('submitMsg');

			if(!linkInput.startsWith('http')) {
				alert('유효한 공유 링크(URL)를 입력해주세요.');
				return;
			}

			try {
				var response = await fetch('/', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					// 링크만 깔끔하게 보냅니다.
					body: JSON.stringify({ link: linkInput })
				});

				var result = await response.json();
				if(result.success) {
					document.getElementById('aiShareLink').value = '';
					msgEl.style.display = 'block';
					setTimeout(() => { msgEl.style.display = 'none'; }, 3000);
				} else {
					alert('오류가 발생했습니다: ' + result.message);
				}
			} catch (error) {
				console.error('Error:', error);
				alert('서버와 통신할 수 없습니다.');
			}
		}
	</script>
