[package]
name = "pd-nav"
description = "접근성 내비게이션 코어: 후보 영역 합치기, 번호 매기기, 이름의 개인정보 거르기, 영역 지도(navmap/1). 모델 · 저장소 · HTTP 없음"
version = "0.1.0"
edition = "2021"

[dependencies]
# hashId (ethers 의 hashMessage + computeAddress)는 익명 계정과 같은 crate 가 맡는다
pd-identity = { path = "../pd-identity" }
pd-verdict = { path = "../pd-verdict" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
