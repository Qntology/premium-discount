[package]
name = "premium-discount-identity"
description = "익명 계정(사용자가 시드 구문을 보관하는 ethers 지갑)과 hashId · EIP-191 서명 · 요청 서명. 기준은 contracts/wallet_v1.json"
version = "0.1.0"
edition = "2021"

[dependencies]
getrandom = "0.3"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
